<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор кампаний заказчиков</title>
<style>
  :root {
    --bg: #14161b;
    --panel: #1e2129;
    --panel-light: #282c36;
    --panel-lighter: #323744;
    --border: #3a3f47;
    --text: #eceef1;
    --text-dim: #9aa1ab;
    --accent: #d4a13a;
    --accent-dim: #8c6f2c;
    --good: #4caf7d;
    --bad: #d4573a;
    --radius: 10px;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(20, 22, 27, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    margin: 0;
    font-size: 1.25em;
    color: var(--accent);
  }
  .topbar-meta {
    font-size: 0.82em;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.92em;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-primary:hover { background: #e3b355; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary { background: var(--panel-light); color: var(--text); border: 1px solid var(--accent-dim); }
  .btn-secondary:hover { background: var(--panel-lighter); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); padding: 8px 14px; font-size: 0.88em; }
  .btn-danger:hover { background: rgba(212, 87, 58, 0.12); }
  .btn-icon {
    padding: 7px 10px;
    min-width: 36px;
    justify-content: center;
  }

  .statusbar {
    padding: 8px 20px;
    font-size: 0.88em;
    border-bottom: 1px solid var(--border);
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .statusbar.ok { color: var(--good); background: rgba(76, 175, 125, 0.08); }
  .statusbar.err { color: var(--bad); background: rgba(212, 87, 58, 0.08); }
  .statusbar.dirty { color: var(--accent); background: rgba(212, 161, 58, 0.08); }
  .statusbar.neutral { color: var(--text-dim); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 0;
  }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 120px);
  }
  .sidebar-tools {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search {
    width: 100%;
    background: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.92em;
    font-family: inherit;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .nav-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--panel-light);
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: inherit;
    font-family: inherit;
  }
  .nav-item:hover { border-color: var(--border); background: var(--panel-lighter); }
  .nav-item.active {
    border-color: var(--accent-dim);
    background: rgba(212, 161, 58, 0.1);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .nav-thumb {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    background: #1a1610;
    border: 2px solid var(--accent-dim);
    flex-shrink: 0;
  }
  .nav-thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1em;
    color: var(--text-dim);
  }
  .nav-body { min-width: 0; flex: 1; }
  .nav-name {
    font-weight: 700;
    font-size: 0.92em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-tags {
    font-size: 0.72em;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .editor {
    padding: 20px 24px 32px;
    overflow-y: auto;
    min-height: calc(100vh - 120px);
  }
  .editor-empty {
    color: var(--text-dim);
    padding: 40px 0;
    text-align: center;
  }

  .editor-header {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .portrait-block { flex-shrink: 0; text-align: center; }
  .portrait-preview {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    border: 3px solid var(--accent-dim);
    background: #1a1610;
    display: block;
    margin: 0 auto 8px;
  }
  .portrait-preview.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    color: var(--text-dim);
  }
  .portrait-hint { font-size: 0.72em; color: var(--text-dim); max-width: 110px; line-height: 1.3; }

  .editor-title-block { flex: 1; min-width: 220px; }
  .editor-title-block h2 { margin: 0 0 4px; font-size: 1.4em; color: var(--accent); }
  .editor-id { font-size: 0.82em; color: var(--text-dim); font-family: Consolas, monospace; }
  .editor-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h3 {
    margin: 0 0 12px;
    font-size: 0.78em;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 0.72em;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .field-hint {
    font-size: 0.78em;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.35;
  }
  .field-hint.warn { color: #e0a060; }
  .field-hint.ok { color: var(--good); }

  .field input[type=text],
  .field input[type=url],
  .field input[type=number],
  .field textarea,
  .field select {
    width: 100%;
    background: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.95em;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input.invalid, .field select.invalid { border-color: var(--bad); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .tag-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78em;
    background: rgba(212, 161, 58, 0.12);
    border: 1px solid rgba(212, 161, 58, 0.3);
    color: var(--accent);
  }
  .tag-badge.warn { background: rgba(212, 87, 58, 0.1); border-color: rgba(212, 87, 58, 0.35); color: #e08068; }

  .ladder-table-wrap { overflow-x: auto; }
  .ladder-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84em;
  }
  .ladder-table th,
  .ladder-table td {
    padding: 7px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .ladder-table th { color: var(--text-dim); font-weight: 600; font-size: 0.85em; }
  .ladder-table tr:last-child td { border-bottom: none; }
  .phase-genre td:first-child { color: #c4b48a; }
  .phase-period td:first-child { color: #8ec4a0; }
  .phase-artist td:first-child { color: var(--accent); }
  .phase-mixed td:first-child { color: #9aa1ab; }

  .missions-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }
  .missions-toolbar .field-hint { margin: 0; flex: 1; min-width: 200px; }

  .template-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr) auto;
    gap: 8px;
    align-items: end;
    margin-bottom: 14px;
    padding: 12px;
    background: var(--panel-light);
    border-radius: 8px;
    border: 1px dashed var(--border);
  }
  .template-row label { font-size: 0.72em; color: var(--text-dim); display: block; margin-bottom: 4px; }

  .missions-list { display: flex; flex-direction: column; gap: 10px; }

  .mission-day {
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .mission-day-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .mission-day-num {
    font-weight: 700;
    font-size: 0.92em;
    color: var(--accent);
    min-width: 72px;
  }
  .mission-match {
    font-size: 0.78em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(76, 175, 125, 0.12);
    color: var(--good);
    border: 1px solid rgba(76, 175, 125, 0.25);
  }
  .mission-match.warn {
    background: rgba(212, 87, 58, 0.1);
    color: #e08068;
    border-color: rgba(212, 87, 58, 0.3);
  }
  .mission-day-actions { margin-left: auto; display: flex; gap: 4px; }

  .mission-tags { display: flex; flex-direction: column; gap: 6px; }
  .mission-tag-row {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .mission-tag-row select { padding: 7px 9px; font-size: 0.88em; }

  .btn-xs {
    padding: 5px 8px;
    font-size: 0.78em;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
  }
  .btn-xs:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-xs.danger:hover { color: var(--bad); border-color: var(--bad); }

  .json-panel {
    margin: 0 24px 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .json-panel summary {
    cursor: pointer;
    padding: 12px 16px;
    color: var(--text-dim);
    font-size: 0.88em;
    user-select: none;
  }
  .json-panel pre {
    margin: 0;
    padding: 0 16px 16px;
    overflow: auto;
    max-height: 280px;
    font-size: 0.8em;
    white-space: pre-wrap;
    color: var(--text-dim);
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { min-height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar-list { max-height: 220px; }
    .row3 { grid-template-columns: 1fr; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div>
      <h1>Редактор кампаний заказчиков</h1>
      <div class="topbar-meta">Изменения сохраняются в <code>js/collectors.js</code> — игра подхватывает их после перезагрузки</div>
    </div>
    <div class="topbar-actions">
      <a href="artworks.html" class="btn btn-ghost">Каталог картин</a>
      <a href="index.html" class="btn btn-ghost" target="_blank">Открыть игру ↗</a>
      <button type="button" id="btn-reload" class="btn btn-secondary">Обновить с диска</button>
      <button type="button" id="btn-save" class="btn btn-primary">Сохранить</button>
    </div>
  </header>

  <div id="status" class="statusbar neutral">Загрузка…</div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-tools">
        <input type="search" id="search" class="search" placeholder="Поиск по имени или ID…">
        <button type="button" id="btn-add" class="btn btn-secondary" style="width:100%">+ Новый заказчик</button>
      </div>
      <div id="sidebar-list" class="sidebar-list"></div>
    </aside>

    <main id="editor" class="editor">
      <div class="editor-empty">Выберите заказчика слева или создайте нового.</div>
    </main>
  </div>

  <details class="json-panel">
    <summary>Сырой JSON (для отладки)</summary>
    <pre id="json-preview"></pre>
  </details>
</div>

<script>
  const TAG_TYPE_KEYS = { period: 'periods', genre: 'genres', artist: 'artists' };
  const VENUE_LABELS = { local: 'Местный', regular: 'Обычный', elite: 'Элитный' };

  const BUDGET_MULTIPLIER_START = 0.9;
  const BUDGET_MULTIPLIER_END = 1.6;
  const ORDER_PHASE_GENRE_DAYS = 3;
  const ORDER_PHASE_PERIOD_DAYS = 3;
  const ORDER_PHASE_ARTIST_DAYS = 4;
  const ORDER_LADDER_LENGTH =
    ORDER_PHASE_GENRE_DAYS + ORDER_PHASE_PERIOD_DAYS + ORDER_PHASE_ARTIST_DAYS;

  const TAG_TYPE_LABELS = { period: 'Период', genre: 'Жанр', artist: 'Автор' };

  let collectors = [];
  let savedSnapshot = '[]';
  let tagOptions = { periods: [], genres: [], artists: [], artworkTotal: 0 };
  let artworkIndex = [];
  let selectedIdx = -1;
  let searchQuery = '';

  const sidebarListEl = document.getElementById('sidebar-list');
  const editorEl = document.getElementById('editor');
  const statusEl = document.getElementById('status');
  const jsonPreviewEl = document.getElementById('json-preview');
  const saveBtn = document.getElementById('btn-save');

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'statusbar' + (kind ? ' ' + kind : ' neutral');
    saveBtn.disabled = kind === 'err';
  }

  function isDirty() {
    return JSON.stringify(collectors) !== savedSnapshot;
  }

  function portraitUrl(collector) {
    if (collector.portraitSource) return `assets/collectors/${collector.id}.webp`;
    return '';
  }

  function buildTemplateMissions(genre, period, artist) {
    const missions = [];
    for (let i = 0; i < ORDER_PHASE_GENRE_DAYS; i++) {
      missions.push({ tags: [{ type: 'genre', value: genre }] });
    }
    for (let i = 0; i < ORDER_PHASE_PERIOD_DAYS; i++) {
      missions.push({ tags: [{ type: 'period', value: period }] });
    }
    for (let i = 0; i < ORDER_PHASE_ARTIST_DAYS; i++) {
      missions.push({ tags: [{ type: 'artist', value: artist }] });
    }
    return missions;
  }

  function ensureMissions(c) {
    if (!Array.isArray(c.missions) || !c.missions.length) {
      c.missions = buildTemplateMissions(
        c.orderGenre || tagOptions.genres[0]?.value || '',
        c.orderPeriod || tagOptions.periods[0]?.value || '',
        c.orderArtist || tagOptions.artists[0]?.value || ''
      );
    }
    return c.missions;
  }

  function syncLegacyFields(c) {
    ensureMissions(c);
    const pick = (type) => {
      for (const m of c.missions) {
        const tag = m.tags.find((t) => t.type === type);
        if (tag) return tag.value;
      }
      return c['order' + type.charAt(0).toUpperCase() + type.slice(1)] || '';
    };
    c.orderGenre = pick('genre');
    c.orderPeriod = pick('period');
    c.orderArtist = pick('artist');
  }

  function getCollectorLadderLength(c) {
    return ensureMissions(c).length;
  }

  function artworkMatchesTag(art, tag) {
    if (tag.type === 'genre') return art.genre === tag.value;
    if (tag.type === 'period') return art.period === tag.value;
    if (tag.type === 'artist') return art.artist === tag.value;
    return false;
  }

  function countMissionMatches(tags) {
    if (!Array.isArray(tags) || !tags.length) return 0;
    return artworkIndex.filter((a) => tags.every((t) => artworkMatchesTag(a, t))).length;
  }

  function getMissionPhase(tags) {
    if (!tags || tags.length !== 1) return 'mixed';
    return tags[0].type;
  }

  function computeMissionPreview(missionIndex, ladderLength) {
    const length = Math.max(1, ladderLength);
    const t = Math.min(missionIndex, length - 1) / Math.max(1, length - 1);
    let venueTier;
    if (missionIndex < length * 0.2) venueTier = 'local';
    else if (missionIndex < length * 0.8) venueTier = 'regular';
    else venueTier = 'elite';
    const trophyStart = Math.floor(length * 0.7);
    const trophyChance =
      missionIndex < trophyStart
        ? 0
        : lerp(0, 0.35, (missionIndex - trophyStart) / Math.max(1, length - 1 - trophyStart));
    const budgetMultiplier = lerp(BUDGET_MULTIPLIER_START, BUDGET_MULTIPLIER_END, t);
    return { venueTier, trophyChance, budgetMultiplier };
  }

  function describeOrderTags(tags) {
    return tags.map((t) => `${TAG_TYPE_LABELS[t.type]}: ${t.value}`).join(' + ');
  }

  function buildLadderRows(collector) {
    const missions = ensureMissions(collector);
    const length = missions.length;
    return missions.map((mission, i) => {
      const tags = mission.tags;
      const preview = computeMissionPreview(i, length);
      const matchCount = countMissionMatches(tags);
      return {
        order: i + 1,
        phase: getMissionPhase(tags),
        tags: describeOrderTags(tags),
        venue: VENUE_LABELS[preview.venueTier],
        budget: preview.budgetMultiplier.toFixed(2),
        trophy: Math.round(preview.trophyChance * 100),
        matchCount,
      };
    });
  }

  function pluralLots(n) {
    const m10 = n % 10;
    const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'лот';
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'лота';
    return 'лотов';
  }

  function matchBadgeHtml(count) {
    const cls = count > 0 ? 'mission-match' : 'mission-match warn';
    const text = count > 0 ? `${count} ${pluralLots(count)}` : '0 лотов';
    return `<span class="${cls}">${text}</span>`;
  }

  function buildTagTypeSelect(selected) {
    let html = '<select data-tag-type>';
    ['genre', 'period', 'artist'].forEach((type) => {
      html += `<option value="${type}"${type === selected ? ' selected' : ''}>${TAG_TYPE_LABELS[type]}</option>`;
    });
    return html + '</select>';
  }

  function buildTagValueSelect(type, current) {
    const key = TAG_TYPE_KEYS[type];
    const options = tagOptions[key] || [];
    let html = '<select data-tag-value>';
    html += '<option value="">— выберите —</option>';
    options.forEach((opt) => {
      const sel = opt.value === current ? ' selected' : '';
      html += `<option value="${escapeAttr(opt.value)}"${sel}>${escapeHtml(opt.value)} (${opt.count})</option>`;
    });
    if (current && !options.some((o) => o.value === current)) {
      html += `<option value="${escapeAttr(current)}" selected>${escapeHtml(current)} (?)</option>`;
    }
    return html + '</select>';
  }

  function buildMissionsEditorHtml(collector) {
    const missions = ensureMissions(collector);
    const daysHtml = missions
      .map((mission, mi) => {
        const tagsHtml = mission.tags
          .map(
            (tag, ti) => `
          <div class="mission-tag-row" data-mission-idx="${mi}" data-tag-idx="${ti}">
            ${buildTagTypeSelect(tag.type)}
            ${buildTagValueSelect(tag.type, tag.value)}
            <button type="button" class="btn-xs danger" data-remove-tag title="Убрать тег">−</button>
          </div>`
          )
          .join('');
        return `
        <div class="mission-day" data-mission-idx="${mi}">
          <div class="mission-day-head">
            <span class="mission-day-num">Заказ ${mi + 1}</span>
            ${matchBadgeHtml(countMissionMatches(mission.tags))}
            <div class="mission-day-actions">
              <button type="button" class="btn-xs" data-move-mission-up title="Выше">↑</button>
              <button type="button" class="btn-xs" data-move-mission-down title="Ниже">↓</button>
              <button type="button" class="btn-xs" data-duplicate-mission title="Копировать">⧉</button>
              <button type="button" class="btn-xs danger" data-remove-mission title="Удалить день">×</button>
            </div>
          </div>
          <div class="mission-tags">${tagsHtml}</div>
          <button type="button" class="btn-xs" data-add-tag style="margin-top:6px">+ тег (условие И)</button>
        </div>`;
      })
      .join('');

    const tplGenre = collector.orderGenre || tagOptions.genres[0]?.value || '';
    const tplPeriod = collector.orderPeriod || tagOptions.periods[0]?.value || '';
    const tplArtist = collector.orderArtist || tagOptions.artists[0]?.value || '';

    return `
      <div class="missions-toolbar">
        <button type="button" class="btn btn-secondary" data-add-mission>+ День кампании</button>
        <span class="field-hint">После последнего дня условия финального заказа повторяются бесконечно.</span>
      </div>
      <div class="template-row">
        <div><label>Жанр</label>${buildTagValueSelect('genre', tplGenre).replace('data-tag-value', 'data-tpl-genre')}</div>
        <div><label>Период</label>${buildTagValueSelect('period', tplPeriod).replace('data-tag-value', 'data-tpl-period')}</div>
        <div><label>Автор</label>${buildTagValueSelect('artist', tplArtist).replace('data-tag-value', 'data-tpl-artist')}</div>
        <button type="button" class="btn btn-secondary" data-fill-template>Шаблон ${ORDER_PHASE_GENRE_DAYS}+${ORDER_PHASE_PERIOD_DAYS}+${ORDER_PHASE_ARTIST_DAYS}</button>
      </div>
      <div class="missions-list" data-missions-list>${daysHtml}</div>
    `;
  }

  function refreshLadderPreview(collector) {
    const tbody = editorEl.querySelector('[data-ladder-body]');
    if (!tbody) return;
    tbody.innerHTML = buildLadderRows(collector)
      .map(
        (r) =>
          `<tr class="phase-${r.phase}"><td>${r.order}</td><td>${escapeHtml(r.tags)}</td>` +
          `<td>${r.matchCount}</td><td>${r.venue}</td><td>×${r.budget}</td><td>${r.trophy}%</td></tr>`
      )
      .join('');
    const title = editorEl.querySelector('[data-ladder-title]');
    if (title) title.textContent = `Предпросмотр (${getCollectorLadderLength(collector)} заказов)`;
  }

  function bindMissionsEditor(idx) {
    const c = collectors[idx];
    const root = editorEl.querySelector('[data-missions-root]');
    if (!root) return;

    root.querySelector('[data-add-mission]')?.addEventListener('click', () => {
      ensureMissions(c);
      c.missions.push({
        tags: [{ type: 'genre', value: tagOptions.genres[0]?.value || '' }],
      });
      syncLegacyFields(c);
      renderEditor(idx);
      onChange();
    });

    root.querySelector('[data-fill-template]')?.addEventListener('click', () => {
      const genre = root.querySelector('[data-tpl-genre]')?.value || '';
      const period = root.querySelector('[data-tpl-period]')?.value || '';
      const artist = root.querySelector('[data-tpl-artist]')?.value || '';
      c.missions = buildTemplateMissions(genre, period, artist);
      syncLegacyFields(c);
      renderEditor(idx);
      onChange();
    });

    root.querySelectorAll('[data-remove-mission]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mi = +btn.closest('.mission-day').dataset.missionIdx;
        if (c.missions.length <= 1) {
          setStatus('Нужен хотя бы один день кампании.', 'err');
          return;
        }
        c.missions.splice(mi, 1);
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-duplicate-mission]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mi = +btn.closest('.mission-day').dataset.missionIdx;
        c.missions.splice(mi + 1, 0, JSON.parse(JSON.stringify(c.missions[mi])));
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-move-mission-up]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mi = +btn.closest('.mission-day').dataset.missionIdx;
        if (mi <= 0) return;
        [c.missions[mi - 1], c.missions[mi]] = [c.missions[mi], c.missions[mi - 1]];
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-move-mission-down]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mi = +btn.closest('.mission-day').dataset.missionIdx;
        if (mi >= c.missions.length - 1) return;
        [c.missions[mi], c.missions[mi + 1]] = [c.missions[mi + 1], c.missions[mi]];
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-add-tag]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mi = +btn.closest('.mission-day').dataset.missionIdx;
        c.missions[mi].tags.push({ type: 'genre', value: tagOptions.genres[0]?.value || '' });
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-remove-tag]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.mission-tag-row');
        const mi = +row.dataset.missionIdx;
        const ti = +row.dataset.tagIdx;
        if (c.missions[mi].tags.length <= 1) {
          setStatus('У заказа должен быть хотя бы один тег.', 'err');
          return;
        }
        c.missions[mi].tags.splice(ti, 1);
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-tag-type]').forEach((sel) => {
      sel.addEventListener('change', () => {
        const row = sel.closest('.mission-tag-row');
        const mi = +row.dataset.missionIdx;
        const ti = +row.dataset.tagIdx;
        c.missions[mi].tags[ti].type = sel.value;
        const valueSel = row.querySelector('[data-tag-value]');
        const first = tagOptions[TAG_TYPE_KEYS[sel.value]]?.[0]?.value || '';
        c.missions[mi].tags[ti].value = valueSel.value || first;
        syncLegacyFields(c);
        renderEditor(idx);
        onChange();
      });
    });

    root.querySelectorAll('[data-tag-value]').forEach((sel) => {
      sel.addEventListener('change', () => {
        const row = sel.closest('.mission-tag-row');
        const mi = +row.dataset.missionIdx;
        const ti = +row.dataset.tagIdx;
        c.missions[mi].tags[ti].value = sel.value;
        syncLegacyFields(c);
        const day = root.querySelector(`.mission-day[data-mission-idx="${mi}"]`);
        if (day) {
          const badge = day.querySelector('.mission-match, .mission-match.warn');
          if (badge) badge.outerHTML = matchBadgeHtml(countMissionMatches(c.missions[mi].tags));
        }
        refreshLadderPreview(c);
        onChange();
      });
    });
  }

  function formatMoney(n) {
    return Math.round(n).toLocaleString('ru-RU');
  }

  function estimatedBudget(collector, multiplier) {
    return Math.round((collector.baseBudget * multiplier) / 100) * 100;
  }

  function onChange() {
    if (isDirty()) setStatus('Есть несохранённые изменения — нажмите «Сохранить» (Ctrl+S).', 'dirty');
    jsonPreviewEl.textContent = JSON.stringify(collectors, null, 2);
    renderSidebar();
  }

  function filteredIndices() {
    const q = searchQuery.trim().toLowerCase();
    return collectors
      .map((c, i) => ({ c, i }))
      .filter(({ c }) => {
        if (!q) return true;
        return (
          (c.nameRu || '').toLowerCase().includes(q) ||
          (c.id || '').toLowerCase().includes(q) ||
          (c.orderGenre || '').toLowerCase().includes(q) ||
          (c.orderPeriod || '').toLowerCase().includes(q) ||
          (c.orderArtist || '').toLowerCase().includes(q)
        );
      })
      .map(({ i }) => i);
  }

  function renderSidebar() {
    sidebarListEl.innerHTML = '';
    const indices = filteredIndices();
    if (!indices.length) {
      sidebarListEl.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:0.88em">Ничего не найдено</div>';
      return;
    }
    indices.forEach((idx) => {
      const c = collectors[idx];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-item' + (idx === selectedIdx ? ' active' : '');
      const url = portraitUrl(c);
      const thumb = url
        ? `<img class="nav-thumb" src="${escapeAttr(url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'nav-thumb placeholder',textContent:'👤'}))">`
        : `<div class="nav-thumb placeholder">👤</div>`;
      btn.innerHTML = `
        ${thumb}
        <div class="nav-body">
          <div class="nav-name">${escapeHtml(c.nameRu || '(без имени)')}</div>
          <div class="nav-tags">${getCollectorLadderLength(c)} заказов · ${escapeHtml(c.orderGenre || '—')}</div>
        </div>
      `;
      btn.addEventListener('click', () => selectCollector(idx));
      sidebarListEl.appendChild(btn);
    });
  }

  function selectCollector(idx) {
    selectedIdx = idx;
    renderSidebar();
    renderEditor(idx);
  }

  function renderEditor(idx) {
    const c = collectors[idx];
    if (!c) {
      editorEl.innerHTML = '<div class="editor-empty">Выберите заказчика слева или создайте нового.</div>';
      return;
    }

    ensureMissions(c);
    syncLegacyFields(c);

    const url = portraitUrl(c);
    const portraitHtml = url
      ? `<img class="portrait-preview" id="portrait-preview" src="${escapeAttr(url)}" alt="">`
      : `<div class="portrait-preview placeholder" id="portrait-preview">👤</div>`;

    const ladderRows = buildLadderRows(c);
    const ladderLen = getCollectorLadderLength(c);
    const ladderHtml = ladderRows
      .map(
        (r) =>
          `<tr class="phase-${r.phase}"><td>${r.order}</td><td>${escapeHtml(r.tags)}</td>` +
          `<td>${r.matchCount}</td><td>${r.venue}</td><td>×${r.budget}</td><td>${r.trophy}%</td></tr>`
      )
      .join('');

    const budgetExample = estimatedBudget(c, BUDGET_MULTIPLIER_START);
    const budgetMax = estimatedBudget(c, BUDGET_MULTIPLIER_END);

    editorEl.innerHTML = `
      <div class="editor-header">
        <div class="portrait-block">
          ${portraitHtml}
          <div class="portrait-hint">После смены URL запустите npm run fetch-collectors</div>
        </div>
        <div class="editor-title-block">
          <h2 data-display-name>${escapeHtml(c.nameRu || '(без имени)')}</h2>
          <div class="editor-id" data-display-id>${escapeHtml(c.id)}</div>
          <div class="editor-actions">
            <button type="button" class="btn btn-ghost btn-icon" data-move-up title="Выше">↑</button>
            <button type="button" class="btn btn-ghost btn-icon" data-move-down title="Ниже">↓</button>
            <button type="button" class="btn btn-ghost" data-duplicate>Дублировать</button>
            <button type="button" class="btn btn-danger" data-delete>Удалить</button>
          </div>
        </div>
      </div>

      <section class="card">
        <h3>Основное</h3>
        <div class="row2">
          <div class="field">
            <label>ID (латиница, цифры, дефис)</label>
            <input type="text" data-field="id" value="${escapeAttr(c.id)}" spellcheck="false">
          </div>
          <div class="field">
            <label>Имя заказчика</label>
            <input type="text" data-field="nameRu" value="${escapeAttr(c.nameRu)}">
          </div>
        </div>
        <div class="field">
          <label>Описание вкуса (tagline)</label>
          <textarea data-field="taglineRu">${escapeHtml(c.taglineRu || '')}</textarea>
        </div>
        <div class="field">
          <label>URL портрета (portraitSource)</label>
          <input type="url" data-field="portraitSource" value="${escapeAttr(c.portraitSource || '')}" placeholder="https://commons.wikimedia.org/…">
        </div>
      </section>

      <section class="card">
        <h3>Экономика</h3>
        <div class="row2">
          <div class="field">
            <label>Базовый бюджет заказа, ₽</label>
            <input type="number" step="10000" min="0" data-field="baseBudget" value="${c.baseBudget || 0}">
            <div class="field-hint">На 1-м заказе ≈ ${formatMoney(budgetExample)} ₽, на последнем ≈ ${formatMoney(budgetMax)} ₽ (×множитель ветки)</div>
          </div>
          <div class="field">
            <label>Личный множитель комиссии</label>
            <input type="number" step="0.05" min="0.1" data-field="personalModifier" value="${c.personalModifier || 1}">
            <div class="field-hint">1.0 — нейтрально, выше — щедрее, ниже — скупее</div>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>Лестница заказов — теги по дням</h3>
        <div data-missions-root>${buildMissionsEditorHtml(c)}</div>
      </section>

      <section class="card">
        <h3 data-ladder-title>Предпросмотр (${ladderLen} заказов)</h3>
        <div class="ladder-table-wrap">
          <table class="ladder-table">
            <thead>
              <tr><th>#</th><th>Условие</th><th>Лотов</th><th>Аукцион</th><th>Бюджет</th><th>Трофей</th></tr>
            </thead>
            <tbody data-ladder-body>${ladderHtml}</tbody>
          </table>
        </div>
      </section>
    `;

    editorEl.querySelectorAll('[data-field]').forEach((input) => {
      input.addEventListener('input', () => applyField(idx, input));
      input.addEventListener('change', () => applyField(idx, input));
    });

    editorEl.querySelector('[data-delete]').addEventListener('click', () => deleteCollector(idx));
    editorEl.querySelector('[data-duplicate]').addEventListener('click', () => duplicateCollector(idx));
    editorEl.querySelector('[data-move-up]').addEventListener('click', () => moveCollector(idx, -1));
    editorEl.querySelector('[data-move-down]').addEventListener('click', () => moveCollector(idx, 1));
    bindMissionsEditor(idx);
  }

  function applyField(idx, input) {
    const c = collectors[idx];
    const field = input.dataset.field;
    let value = input.value;
    if (field === 'personalModifier' || field === 'baseBudget') value = parseFloat(value) || 0;

    if (field === 'id' && !/^[a-z0-9-]*$/.test(value)) {
      input.classList.add('invalid');
    } else {
      input.classList.remove('invalid');
    }

    c[field] = value;

    if (field === 'nameRu') {
      const el = editorEl.querySelector('[data-display-name]');
      if (el) el.textContent = value || '(без имени)';
    }
    if (field === 'id') {
      const el = editorEl.querySelector('[data-display-id]');
      if (el) el.textContent = value;
      const preview = document.getElementById('portrait-preview');
      if (preview && c.portraitSource && preview.tagName === 'IMG') {
        preview.src = portraitUrl(c);
      }
    }
    if (field === 'portraitSource') {
      const preview = document.getElementById('portrait-preview');
      if (preview && c.portraitSource) {
        if (preview.tagName !== 'IMG') {
          const img = document.createElement('img');
          img.className = 'portrait-preview';
          img.id = 'portrait-preview';
          img.src = portraitUrl(c);
          preview.replaceWith(img);
        } else {
          preview.src = portraitUrl(c);
        }
      }
    }

    if (field === 'baseBudget') {
      renderEditor(idx);
      return;
    }

    onChange();
  }

  function addCollector() {
    const firstGenre = tagOptions.genres[0]?.value || '';
    const firstPeriod = tagOptions.periods[0]?.value || '';
    const firstArtist = tagOptions.artists[0]?.value || '';
    collectors.push({
      id: 'new-collector-' + Date.now().toString(36),
      nameRu: 'Новый заказчик',
      taglineRu: 'Описание вкуса заказчика',
      personalModifier: 1,
      baseBudget: 300000,
      orderGenre: firstGenre,
      orderPeriod: firstPeriod,
      orderArtist: firstArtist,
      missions: buildTemplateMissions(firstGenre, firstPeriod, firstArtist),
    });
    selectCollector(collectors.length - 1);
    onChange();
  }

  function duplicateCollector(idx) {
    const src = collectors[idx];
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = src.id + '-copy-' + Date.now().toString(36).slice(-4);
    copy.nameRu = (src.nameRu || 'Заказчик') + ' (копия)';
    collectors.splice(idx + 1, 0, copy);
    selectCollector(idx + 1);
    onChange();
  }

  function deleteCollector(idx) {
    const c = collectors[idx];
    if (!confirm(`Удалить заказчика «${c.nameRu}»?`)) return;
    collectors.splice(idx, 1);
    if (selectedIdx >= collectors.length) selectedIdx = collectors.length - 1;
    if (selectedIdx < 0) {
      editorEl.innerHTML = '<div class="editor-empty">Выберите заказчика слева или создайте нового.</div>';
    } else {
      renderEditor(selectedIdx);
    }
    onChange();
  }

  function moveCollector(idx, dir) {
    const next = idx + dir;
    if (next < 0 || next >= collectors.length) return;
    const tmp = collectors[idx];
    collectors[idx] = collectors[next];
    collectors[next] = tmp;
    selectedIdx = next;
    renderSidebar();
    renderEditor(selectedIdx);
    onChange();
  }

  function validateClientSide() {
    const ids = new Set();
    for (const c of collectors) {
      if (!/^[a-z0-9-]+$/.test(c.id || '')) return `Некорректный ID «${c.id}» — только a-z, 0-9 и дефис.`;
      if (ids.has(c.id)) return `Повторяющийся ID «${c.id}».`;
      ids.add(c.id);
      if (!c.nameRu || !c.nameRu.trim()) return `У заказчика «${c.id}» пустое имя.`;
      if (!c.taglineRu || !c.taglineRu.trim()) return `У «${c.nameRu}» пустое описание (taglineRu).`;
      ensureMissions(c);
      syncLegacyFields(c);
      if (!c.missions.length) return `У «${c.nameRu}» пустая лестница заказов.`;
      for (let i = 0; i < c.missions.length; i++) {
        const tags = c.missions[i].tags;
        if (!Array.isArray(tags) || !tags.length) {
          return `У «${c.nameRu}» заказ ${i + 1}: нужен хотя бы один тег.`;
        }
        for (const tag of tags) {
          if (!['genre', 'period', 'artist'].includes(tag.type)) {
            return `У «${c.nameRu}» заказ ${i + 1}: неизвестный тип тега.`;
          }
          if (!tag.value || !tag.value.trim()) {
            return `У «${c.nameRu}» заказ ${i + 1}: пустое значение тега.`;
          }
        }
      }
      if (!(c.personalModifier > 0)) return `У «${c.nameRu}» некорректный personalModifier.`;
      if (!(c.baseBudget > 0)) return `У «${c.nameRu}» некорректный baseBudget.`;
    }
    return null;
  }

  async function saveAll() {
    const clientError = validateClientSide();
    if (clientError) {
      setStatus(clientError, 'err');
      return;
    }
    collectors.forEach((c) => syncLegacyFields(c));
    setStatus('Сохранение…', 'neutral');
    try {
      const res = await fetch('/api/collectors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(collectors),
      });
      const raw = await res.text();
      let body;
      try {
        body = JSON.parse(raw);
      } catch {
        throw new Error(raw.trim() || 'Не удалось сохранить');
      }
      if (!res.ok) throw new Error(body.error || 'Не удалось сохранить');
      savedSnapshot = JSON.stringify(collectors);
      setStatus(
        `Сохранено: ${body.count} заказчик(ов). Перезагрузите игру (F5), чтобы увидеть изменения.`,
        'ok'
      );
    } catch (e) {
      const hint =
        e.message === 'Failed to fetch'
          ? ' — запустите сервер: npm run design (или node design-server.js).'
          : '';
      setStatus('Ошибка сохранения: ' + e.message + hint, 'err');
    }
  }

  async function parseApiError(res, fallback) {
    const text = await res.text();
    try {
      const body = JSON.parse(text);
      return body.error || fallback;
    } catch {
      return text.trim() || fallback;
    }
  }

  async function loadAll() {
    if (location.protocol === 'file:') {
      setStatus(
        'Откройте через сервер: npm run design → http://localhost:8935/gamedesign.html',
        'err'
      );
      return;
    }
    setStatus('Загрузка…', 'neutral');
    try {
      const [collectorsRes, optionsRes] = await Promise.all([
        fetch('/api/collectors'),
        fetch('/api/tag-options'),
      ]);
      if (!collectorsRes.ok) {
        throw new Error(await parseApiError(collectorsRes, 'Ошибка загрузки заказчиков'));
      }
      if (!optionsRes.ok) {
        throw new Error(await parseApiError(optionsRes, 'Ошибка загрузки справочника'));
      }
      collectors = await collectorsRes.json();
      tagOptions = await optionsRes.json();
      artworkIndex = tagOptions.artworkIndex || [];
      collectors.forEach((c) => ensureMissions(c));
      savedSnapshot = JSON.stringify(collectors);
      selectedIdx = collectors.length ? 0 : -1;
      renderSidebar();
      if (selectedIdx >= 0) renderEditor(selectedIdx);
      else editorEl.innerHTML = '<div class="editor-empty">Нет заказчиков — создайте первого.</div>';
      jsonPreviewEl.textContent = JSON.stringify(collectors, null, 2);
      setStatus(`Загружено ${collectors.length} заказчик(ов), ${tagOptions.artworkTotal || '?'} лотов в каталоге.`, 'ok');
    } catch (e) {
      const hint =
        e.message === 'Failed to fetch'
          ? ' — сервер не запущен. В папке mvp: npm run design'
          : '';
      setStatus('Ошибка: ' + e.message + hint, 'err');
    }
  }

  document.getElementById('btn-save').addEventListener('click', saveAll);
  document.getElementById('btn-add').addEventListener('click', addCollector);
  document.getElementById('btn-reload').addEventListener('click', () => {
    if (isDirty() && !confirm('Есть несохранённые изменения — перезагрузить с диска?')) return;
    loadAll();
  });
  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderSidebar();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveAll();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  loadAll();
</script>
</body>
</html>
